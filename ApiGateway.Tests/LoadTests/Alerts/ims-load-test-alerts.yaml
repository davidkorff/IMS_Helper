groups:
  - name: IMS Load Test Alerts
    rules:
      - alert: HighErrorRate
        expr: rate(ims_http_errors_total[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: High error rate detected
          description: Error rate is above 10% for more than 1 minute

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, rate(ims_response_time_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Slow response times detected
          description: 95th percentile of response time is above 2 seconds

      - alert: HighCPUUsage
        expr: ims_cpu_usage_percent > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High CPU usage detected
          description: CPU usage is above 80% for more than 5 minutes

      - alert: HighMemoryUsage
        expr: ims_memory_usage_bytes > 1e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: High memory usage detected
          description: Memory usage is above 1GB for more than 5 minutes 