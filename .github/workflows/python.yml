name: Python Integration Service CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/integrations/**'
      - 'tests/unit/integrations/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        
    - name: Install dependencies
      run: |
        poetry install
        
    - name: Run tests
      run: |
        poetry run pytest tests/unit/integrations --cov=src/integrations
        
    - name: Build package
      if: github.ref == 'refs/heads/main'
      run: poetry build
        
    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v3
      with:
        name: integration-service
        path: dist 