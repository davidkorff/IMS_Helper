name: .NET API Gateway CI/CD

on:
  push:
    branches: [ main ]
    paths:
      - 'src/ApiGateway/**'
      - 'tests/unit/ApiGateway/**'
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '7.0.x'
        
    - name: Restore dependencies
      run: dotnet restore src/ApiGateway
        
    - name: Build
      run: dotnet build src/ApiGateway --no-restore
        
    - name: Test
      run: dotnet test tests/unit/ApiGateway --no-build --verbosity normal
        
    - name: Publish
      if: github.ref == 'refs/heads/main'
      run: dotnet publish src/ApiGateway -c Release -o publish
        
    - name: Upload artifact
      if: github.ref == 'refs/heads/main'
      uses: actions/upload-artifact@v3
      with:
        name: api-gateway
        path: publish 